<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Link to stylesheet -->
    <link rel="stylesheet" href="./style.css">

    <!-- Link to JS Scripts -->
    <script defer src="./result.js"></script>
    
    <!-- Link to Google Icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" />
    <title>JCIN UNIBEN || STUDENT RESULT</title>
</head>
<body>
    <nav class="nav-bar">
        <div class="left">
            <span class="material-symbols-rounded menu">
                menu
            </span>
            <div class="logo">
                <h2>JCIN</h2>
            </div>

            <div class="txt">
                <h3>Student Login</h3>
                <h5>JCIN UNIBEN</h5>
            </div>
        </div>
        
        <div class="theme">
            <span class="material-symbols-rounded theme-icon">
                light_mode
            </span>
        </div>
    </nav>

    <main class="main-result">
        <div class="result-container">
            <div class="left">
                <div class="percentage-score">
                    85%
                </div>
            </div>

            <div class="right">
                <h3>Your Result</h3>

                <div class="candidate-details">
                    <p class="name">
                        Name: <span class="candidate-name white-space">Julian James</span>
                    </p>
                    <p class="email">
                        Email: <span class="candidate-email white-space">example@gmail.com</span>
                    </p>
                </div>

                <ul class="result-breakdown">
                    <li>
                        Answered Correctly: <span class="score-amount">30</span>
                    </li>

                    <li>
                        Failed: <span class="failed-amount">5</span>
                    </li>

                    <li>
                        Attempted: <span class="num-attempted">35</span>
                    </li>

                    <li>
                        Not Attempted: <span class="mun-not-attempted">5</span>
                    </li>
                </ul>
            </div>
        </div>
    </main>

</body>
</html>
