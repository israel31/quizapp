<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Link to stylesheet -->
    <link rel="stylesheet" href="./style.css">

    <!-- Link to JS Scripts -->
    <script type="module" src="./result.js"></script>
    
    <!-- Link to Google Icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" />
    <title>JCIN UNIBEN || STUDENT RESULT</title>
</head>
<body>
    <nav class="nav-bar">
        <div class="left">
            <span class="material-symbols-rounded menu">
                menu
            </span>
            <div class="logo">
                <h2>JCIN</h2>
            </div>

            <div class="txt">
                <h3>Student Login</h3>
                <h5>JCIN UNIBEN</h5>
            </div>
        </div>
        
        <div class="theme">
            <span class="material-symbols-rounded theme-icon">
                light_mode
            </span>
        </div>
    </nav>

    <main class="main-result">
        <div class="result-container">
            <div class="left">
                <div class="percentage-score">
                    0%
                </div>
            </div>

            <div class="right">
                <div class="portal-badge result-quiz-title">Assessment Result</div>
                <h3>Your Result</h3>
                <p class="performance-badge" style="font-weight: 600; margin-bottom: 0.75rem; color: var(--COLOR-PRIMARY);"></p>

                <div class="candidate-details">
                    <p class="name">
                        Name: <span class="candidate-name white-space"></span>
                    </p>
                    <p class="email">
                        Email: <span class="candidate-email white-space"></span>
                    </p>
                </div>

                <ul class="result-breakdown">
                    <li>
                        Answered Correctly: <span class="score-amount">0</span>
                    </li>

                    <li>
                        Failed: <span class="failed-amount">0</span>
                    </li>

                    <li>
                        Attempted: <span class="num-attempted">0</span>
                    </li>

                    <li>
                        Not Attempted: <span class="mun-not-attempted">0</span>
                    </li>
                </ul>

                <div class="result-actions">
                    <a href="./index.html" class="result-btn result-btn--primary">Take Another Assessment</a>
                    <a href="../../index.html" class="result-btn result-btn--secondary">Platform Hub</a>
                    <a href="../../admin/index.html" class="result-btn result-btn--secondary">Admin Portal</a>
                </div>
            </div>
        </div>

        <section class="review-section" id="reviewSection">
            <h3>
                <span>Question Breakdown & Review</span>
                <span id="reviewCount" style="font-size: 0.95rem; font-weight: 500; color: var(--COLOR-FADE);"></span>
            </h3>
            <div id="reviewCardsContainer"></div>
        </section>
    </main>

</body>
</html>
