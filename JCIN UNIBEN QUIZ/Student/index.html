<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Link to stylesheet -->
    <link rel="stylesheet" href="./style.css">

    <!-- Link to JS Scripts -->
    <script defer src="./login.js"></script>

    <!-- Link to Google Icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" />
    <title>JCIN UNIBEN || STUDENT LOGIN</title>
</head>
<body class="login">
    <nav class="nav-bar">
        <div class="left">
            <span class="material-symbols-rounded menu">
                menu
            </span>
            <div class="logo">
                <h2>JCIN</h2>
            </div>

            <div class="txt">
                <h3>Student Login</h3>
                <h5>JCIN UNIBEN</h5>
            </div>
        </div>
        
        <div class="theme">
            <span class="material-symbols-rounded theme-icon">
                light_mode
            </span>
        </div>
    </nav>
    <div class="login-container">
        <div class="login-content">
            <a href="./test.html" class="quiz-link"></a>
            
            <h1>Welcome!</h1>
            <p>Enter your details to continue</p>

            <form action="#" class="login-form">
                <div class="input-box">
                    <input type="text" placeholder="Full Name" class="name">
                    <span class="material-symbols-rounded icon">
                        person
                    </span>
                    <div class="error">Invalid entery</div>
                </div>

                <div class="input-box">
                    <input type="text" placeholder="Email" class="email">
                    <span class=" material-symbols-rounded iconicon">
                        email
                    </span>
                    <div class="error"></div>
                </div>
                <button type="submit" class="btn" >LOGIN</button>
            </form>
        </div>
    </div>
</body>
</html>
