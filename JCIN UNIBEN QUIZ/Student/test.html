<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./style.css">
    <script defer src="./main.js"></script>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" />
    <title>JCIN UNIBEN || STUDENT QUIZ</title>
</head>

<body>
    <nav class="nav-bar">
        <div class="left">
            <span class="material-symbols-rounded menu">menu</span>

            <div class="logo">
                <h2>JCIN</h2>
            </div>

            <div class="txt">
                <h3>Student Login</h3>
                <h5>JCIN UNIBEN</h5>
            </div>
        </div>

        <div class="theme">
            <span class="material-symbols-rounded theme-icon">light_mode</span>
        </div>
    </nav>

    <div class="prompt">
        <h1 class="quiz-title">Loading Assessment...</h1>

        <div class="txt">
            <p>Welcome <span class="candidate-name white-space"></span></p>
            <p class="quiz-instruction">
                Your assessment instructions will appear here.
            </p>
        </div>

        <button class="start" type="button">START</button>
    </div>

    <main class="main-test">
        <div class="candidate-details">
            <p class="name">
                Name: <span class="candidate-name white-space"></span>
            </p>

            <p class="email">
                Email: <span class="candidate-email white-space"></span>
            </p>

            <p class="quiz-badge active-quiz-badge"></p>
        </div>

        <div class="timer">
            <p class="countdown">00 : 00</p>
        </div>

        <form action="#" class="questions">
            <!-- Questions are loaded securely from Supabase by main.js. -->
        </form>
    </main>
</body>

</html>
