<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Results · JCI Uniben Quiz Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark light">
  <!-- Theme before first paint: identical copy of js/theme-init.js -->
  <script>(function(){try{var t=localStorage.getItem('jci-admin-theme');if(t!=='dark'&&t!=='light'){t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'}document.documentElement.setAttribute('data-theme',t)}catch(e){document.documentElement.setAttribute('data-theme','dark')}})();</script>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/motion.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/results.css">
  <script type="module" src="js/pages/results.js" blocking="render"></script>
</head>
<body class="app" data-page="results" data-title="Results">
  <a class="skip-link" href="#main">Skip to main content</a>
  <div class="sidebar" data-sidebar></div>
  <div class="app-column">
    <header class="topbar" data-topbar></header>
    <div class="banners" data-banners></div>
    <main id="main" class="app-main" tabindex="-1">
      <div class="page">
        <nav class="breadcrumbs" aria-label="Breadcrumb" data-results-crumbs hidden>
          <ol>
            <li><a href="results.html">Results</a></li>
            <li><span aria-current="page" data-crumb-title>Quiz</span></li>
          </ol>
        </nav>
        <header class="page-header results-head">
          <div class="page-header__titles">
            <h1 data-results-title>Results</h1>
            <p class="page-header__description" data-results-desc>Attempts, scores and grading. Scores come from the server; this site only shows them.</p>
            <div class="results-head__badges" data-results-badges></div>
          </div>
          <div class="page-header__actions" data-results-actions></div>
        </header>
        <div class="stack" role="status" data-page-loading>
          <span class="sr-only">Loading…</span>
          <div class="skeleton skeleton--block" aria-hidden="true"></div>
          <div class="skeleton skeleton--line" style="width:70%" aria-hidden="true"></div>
          <div class="skeleton skeleton--line" style="width:52%" aria-hidden="true"></div>
        </div>
        <div class="results" data-page-content hidden>
          <div data-results-body></div>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
