<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard · JCI Uniben Quiz Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark light">
  <!-- Theme before first paint: identical copy of js/theme-init.js -->
  <script>(function(){try{var t=localStorage.getItem('jci-admin-theme');if(t!=='dark'&&t!=='light'){t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'}document.documentElement.setAttribute('data-theme',t)}catch(e){document.documentElement.setAttribute('data-theme','dark')}})();</script>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/motion.css">
  <link rel="stylesheet" href="css/pages.css">
  <script type="module" src="js/pages/dashboard.js" blocking="render"></script>
</head>
<body class="app" data-page="dashboard" data-title="Dashboard">
  <a class="skip-link" href="#main">Skip to main content</a>
  <div class="sidebar" data-sidebar></div>
  <div class="app-column">
    <header class="topbar" data-topbar></header>
    <div class="banners" data-banners></div>
    <main id="main" class="app-main" tabindex="-1">
      <div class="page">
        <header class="page-header">
          <div class="page-header__titles">
            <h1>Dashboard</h1>
            <p class="page-header__description" data-admin-greeting hidden>Welcome back, <span data-admin-first-name></span>.</p>
          </div>
          <div class="page-header__actions">
            <button type="button" class="btn btn--primary" data-new-quiz hidden><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14"/></svg><span class="btn__label">Create quiz</span></button>
            <a class="btn" href="quizzes.html"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4M12 16h4M8 11h.01M8 16h.01"/></svg><span class="btn__label">View all quizzes</span></a>
            <a class="btn" href="results.html"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 3v18h18"/><path d="M7 16v-4M12 16V8M17 16V9"/></svg><span class="btn__label">Open results</span></a>
            <a class="btn" href="../JCIN%20UNIBEN%20QUIZ/Student/index.html" target="_blank" title="Open student test portal"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg><span class="btn__label">Student Portal ↗</span></a>
          </div>
        </header>
        <div class="stack" role="status" data-page-loading>
          <span class="sr-only">Loading…</span>
          <div class="skeleton skeleton--block" aria-hidden="true"></div>
          <div class="skeleton skeleton--line" style="width:70%" aria-hidden="true"></div>
          <div class="skeleton skeleton--line" style="width:52%" aria-hidden="true"></div>
        </div>
        <div data-page-content hidden>
          <div data-dashboard></div>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
